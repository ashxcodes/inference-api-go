# K8s-like limits: default cpu 700m (limit), 1000Mi RAM — override with BENCH_CPU.
# ml-model runtime env: .bench.ml-model.env (generated by run-benchmark.sh).
services:
  ml-model:
    build:
      context: ..
      dockerfile: benchmark/Dockerfile
    image: ml-model-go:benchmark
    cpus: ${BENCH_CPU:-0.7}
    mem_limit: 1000m
    mem_reservation: 1000m
    pids_limit: 256
    env_file:
      - .bench.ml-model.env
    volumes:
      - ${MODEL_TXT}:/models/AMM.txt:ro
    ports:
      - "${BENCH_PORT:-18456}:8456"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8456/health-check-AMM"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

  k6:
    image: grafana/k6:0.54.0
    env_file:
      - .bench.k6.env
    depends_on:
      ml-model:
        condition: service_healthy
    volumes:
      - ./k6/predict.js:/scripts/predict.js:ro
      - ./k6/results:/scripts/results
